apiVersion: apps/v1
kind: Deployment
metadata:
  name: techno-app-deployment
  labels:
    app: techno-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techno-app
  template:
    metadata:
      labels:
        app: techno-app
    spec:
      containers:
      - name: techno-app
        image: 526312876991.dkr.ecr.us-east-1.amazonaws.com/techno-ecr-pati-keefa:latest
        ports:
        - containerPort: 2000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
